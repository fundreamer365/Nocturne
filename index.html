<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nocturne — Deep Space</title>
  <meta name="description" content="Nocturne — тихое интерактивное космическое пространство для прослушивания музыки." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Прелоадер / стартовая заставка -->
  <div id="intro" class="intro">
    <div class="intro__inner">
      <div class="intro__logo">
        <span class="intro__dot"></span>
        <span class="intro__name">Nocturne</span>
      </div>
      <p class="intro__sub">deep space · a quiet place to listen</p>
      <button id="enterBtn" class="btn btn--primary" type="button">
        <span>Enter the space</span>
      </button>
      <p id="introStatus" class="intro__status" aria-live="polite"></p>
      <p class="intro__hint">Наушники сделают путешествие глубже</p>
    </div>
  </div>

  <!-- Канвас сцены -->
  <canvas id="scene" class="scene" aria-hidden="true"></canvas>

  <!-- Верхняя панель -->
  <header class="topbar" id="topbar" aria-hidden="true">
    <div class="topbar__left">
      <span class="brand__dot"></span>
      <span class="brand__name">Nocturne</span>
    </div>
    <div class="topbar__right">
      <span class="spaceTag">
        <span class="spaceTag__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="3.2" transform="rotate(-20 12 12)"></ellipse>
          </svg>
        </span>
        <span>Deep Space</span>
      </span>
    </div>
  </header>

  <!-- Инфо о текущем треке -->
  <section class="nowplaying" id="nowplaying" aria-hidden="true">
    <div class="nowplaying__art" id="npArt">
      <div class="nowplaying__artPlaceholder" aria-hidden="true"></div>
    </div>
    <div class="nowplaying__meta">
      <h1 class="nowplaying__title" id="npTitle">—</h1>
      <p class="nowplaying__artist" id="npArtist">—</p>
    </div>
  </section>

  <!-- Список треков -->
  <aside class="playlist" id="playlist" hidden aria-label="Список треков">
    <div class="playlist__head">
      <span>Playlist</span>
      <button class="iconbtn" id="playlistClose" type="button" title="Свернуть список">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <ol class="playlist__list" id="playlistList"></ol>
    <p class="playlist__empty" id="playlistEmpty" hidden>Плейлист пуст</p>
  </aside>

  <!-- Нижний плеер -->
  <footer class="player" id="player" aria-hidden="true">
    <div class="player__progress">
      <span class="time" id="timeCur">0:00</span>
      <div class="progress" id="progress" role="slider" tabindex="0"
           aria-label="Перемотка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
          <div class="progress__thumb" id="progressThumb"></div>
        </div>
      </div>
      <span class="time" id="timeDur">0:00</span>
    </div>

    <div class="player__controls">
      <div class="player__side player__side--left">
        <button class="iconbtn" id="shuffleBtn" type="button" title="Перемешать (S)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"></path>
            <path d="M4 20L21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
          </svg>
        </button>
      </div>

      <div class="player__side player__side--center">
        <button class="iconbtn" id="prevBtn" type="button" title="Предыдущий (Shift+←)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 5v14L8 12z"></path>
            <path d="M5 5v14"></path>
          </svg>
        </button>
        <button class="playbtn" id="playBtn" type="button" title="Воспроизведение (Space)">
          <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" hidden>
            <path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>
          </svg>
        </button>
        <button class="iconbtn" id="nextBtn" type="button" title="Следующий (Shift+→)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5v14l11-7z"></path>
            <path d="M19 5v14"></path>
          </svg>
        </button>
      </div>

      <div class="player__side player__side--right">
        <button class="iconbtn" id="repeatBtn" type="button" title="Повтор (R)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"></path>
            <path d="M3 11V9a4 4 0 014-4h14"></path>
            <path d="M7 22l-4-4 4-4"></path>
            <path d="M21 13v2a4 4 0 01-4 4H3"></path>
          </svg>
        </button>
        <button class="iconbtn" id="listBtn" type="button" title="Плейлист (L)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h10"></path>
          </svg>
        </button>
        <button class="iconbtn" id="collapseBtn" type="button" title="Свернуть (C)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="player__volume" id="volumeWrap">
      <button class="iconbtn" id="muteBtn" type="button" title="Звук (M)">
        <svg id="volIconHigh" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5L6 9H3v6h3l5 4z"></path>
          <path d="M15.5 8.5a5 5 0 010 7"></path>
          <path d="M18.5 6a8 8 0 010 12"></path>
        </svg>
        <svg id="volIconLow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M11 5L6 9H3v6h3l5 4z"></path>
          <path d="M15.5 8.5a5 5 0 010 7"></path>
        </svg>
        <svg id="volIconMute" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M11 5L6 9H3v6h3l5 4z"></path>
          <path d="M17 9l4 6M21 9l-4 6"></path>
        </svg>
      </button>
      <div class="volume" id="volume" role="slider" tabindex="0"
           aria-label="Громкость" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="volume__track">
          <div class="volume__fill" id="volumeFill"></div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Кнопка разворота свёрнутого плеера -->
  <button class="expand" id="expandBtn" type="button" hidden title="Развернуть плеер">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 15l6-6 6 6"></path>
    </svg>
  </button>

  <!-- Тосты / ошибки -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Three.js: CDN с fallback -->
  <script>
    window.__NOCTURNE_CDN_FALLBACK__ = 'https://unpkg.com/three@0.160.0/build/three.min.js';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
          onerror="(function(){var s=document.createElement('script');s.src=window.__NOCTURNE_CDN_FALLBACK__;s.onerror=function(){window.__NOCTURNE_THREE_FAILED__=true;};document.head.appendChild(s);})()"></script>
  <script src="./app.js" defer></script>
</body>
</html>
